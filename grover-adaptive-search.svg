  <text x="320" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="31" font-style="italic" fill="#148b8e">t</text>
  <path d="M535 165V134H322V147" fill="none" stroke="#148b8e" stroke-width="2.5" marker-end="url(#teal-arrow)"/>
  <g fill="none" stroke="#c7d2da" stroke-width="2"><rect x="489" y="172" width="24" height="24" rx="5"/><rect x="530" y="172" width="24" height="24" rx="5"/><rect x="571" y="172" width="24" height="24" rx="5"/><rect x="489" y="213" width="24" height="24" rx="5"/><rect x="571" y="213" width="24" height="24" rx="5"/><rect x="489" y="254" width="24" height="24" rx="5"/><rect x="530" y="254" width="24" height="24" rx="5"/><rect x="571" y="254" width="24" height="24" rx="5"/></g>

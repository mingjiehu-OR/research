<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Grover adaptive search</title>
  <desc id="desc">Candidate solutions pass through a threshold oracle and amplitude amplification. The threshold is updated adaptively to obtain a near-optimal solution.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#173c55" stroke-width="1.7" stroke-linejoin="round"/></marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#148b8e" stroke-width="1.7" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="400" rx="16" fill="#f7fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173c55">
    <text x="32" y="49" font-size="27" font-weight="600">Grover adaptive search</text>
    <text x="103" y="345" font-size="23" text-anchor="middle">Candidates</text>
    <text x="320" y="345" font-size="23" text-anchor="middle">Amplify</text>
    <text x="537" y="345" font-size="23" text-anchor="middle">Near-optimal</text>
    <text x="322" y="110" font-size="22" text-anchor="middle">Update threshold</text>
  </g>
  <g fill="none" stroke="#173c55" stroke-width="2.5">
    <rect x="51" y="172" width="24" height="24" rx="5"/><rect x="92" y="172" width="24" height="24" rx="5"/><rect x="133" y="172" width="24" height="24" rx="5"/>
    <rect x="51" y="213" width="24" height="24" rx="5"/><rect x="92" y="213" width="24" height="24" rx="5"/><rect x="133" y="213" width="24" height="24" rx="5"/>
    <rect x="51" y="254" width="24" height="24" rx="5"/><rect x="92" y="254" width="24" height="24" rx="5"/><rect x="133" y="254" width="24" height="24" rx="5"/>
  </g>
  <rect x="92" y="213" width="24" height="24" rx="5" fill="#148b8e" stroke="#148b8e" stroke-width="2.5"/>
  <g fill="none" stroke="#173c55" stroke-width="2.5" marker-end="url(#arrow)"><path d="M180 225H235"/><path d="M405 225H464"/></g>
  <circle cx="320" cy="225" r="65" fill="#fff" stroke="#173c55" stroke-width="2.5"/>

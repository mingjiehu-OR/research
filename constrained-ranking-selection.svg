<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Quantum ranking and selection under stochastic constraints</title>
  <desc id="desc">Alternatives undergo objective and constraint evaluation. Infeasible alternatives are eliminated and the best feasible alternative is selected. The checks and crosses illustrate the selection logic rather than data.</desc>

    <text x="82" y="104" font-size="22" text-anchor="middle">Alternatives</text>
    <text x="237" y="104" font-size="22" text-anchor="middle">Objective</text>
    <text x="378" y="104" font-size="22" text-anchor="middle">Constraint</text>
    <text x="532" y="345" font-size="23" text-anchor="middle">Feasible winner</text>
  </g>
